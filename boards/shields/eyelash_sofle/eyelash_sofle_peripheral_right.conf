# Enable SPI
CONFIG_SPI=y
#EXT POWER
CONFIG_ZMK_EXT_POWER=y
CONFIG_INPUT=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# Disable ZMK's built-in underglow effect system so it doesn't fight our module
CONFIG_ZMK_RGB_UNDERGLOW=n

# Sofle per-key cluster RGB module
CONFIG_ZMK_SOFLE_RGB=y
CONFIG_SOFLE_RGB_RIGHT=y
# Uncomment to run LED diagnostic (identifies chain order key-by-key):
# CONFIG_ZMK_SOFLE_RGB_DIAGNOSE=y